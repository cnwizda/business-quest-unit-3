<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Quest - sound test</title>
<style>body{margin:0;background:#0b1020;color:#fff;font-family:"Trebuchet MS",Verdana,sans-serif;padding:14px;max-width:680px;margin:auto}h1{color:#ffd54f;text-shadow:3px 3px 0 #c62828;font-size:30px;margin:.2em 0}h2{color:#39ff14;font-size:19px;margin:1em 0 .3em}p{margin:.3em 0 .8em}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{font:inherit;font-weight:900;font-size:16px;text-align:left;padding:10px;border:3px solid #000;border-radius:10px;background:#ffd54f;color:#1b1b2f;box-shadow:3px 3px 0 #000}button small{display:block;font-weight:700;opacity:.75}button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}button.m{background:#90caf9}</style></head><body>
<h1>BUSINESS QUEST · SOUND TEST</h1><p>Tap a button to hear the sound exactly as it plays in the games. Turn your phone's silent switch off first.</p>
<h2>The ten command-word animals</h2><div class="g" id="a"></div><h2>Game moments</h2><div class="g" id="m"></div>
<script src="bq-sounds.js"></script><script>
var G={coin:0.35,eagle:1.3,bear:1,horse:1.2,owl:0.6,wolf:0.6,camel:0.6,goat:0.6,yak:0.6,leopard:0.55,crane:0.6,unlock:0.5,fanfare:0.55,pop:0.6,page:0.7,chalk:1.2,fail:0.5,good:0.6};
var A=[['eagle','🦅 Eagle','STATE'],['owl','🦉 Owl','DEFINE'],['wolf','🐺 Wolf','IDENTIFY'],['horse','🐎 Horse','OUTLINE'],['yak','🐂 Yak','DESCRIBE'],['camel','🐫 Camel','EXPLAIN'],['goat','🐐 Goat','CALCULATE'],['bear','🐻 Bear','DISCUSS'],['leopard','🐆 Snow leopard','JUSTIFY'],['crane','Crane','CONSIDER']];
var M=[['unlock','🔓 Your code unlocks the game',''],['good','🏅 Good mark from you',''],['fail','📉 Low mark - fix your answer',''],['pop','✔ A mark point lights up',''],['page','📓 Write now',''],['chalk','🖍️ Chalk on the board',''],['fanfare','🎺 Boss Animal Parade',''],['ding','🔔 Timer finished',''],['coin','🪙 Coin',''],['buzzer','❌ Wrong answer',''],['tadaa','🏁 Zone flag',''],['applause','👏 Level complete','']];
var ac=null,cur=null;
function play(k){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); ac.resume(); var bin=atob(BQ_SAMPLES[k]),u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  ac.decodeAudioData(u.buffer,function(b){ if(cur){try{cur.stop();}catch(e){}} var s=ac.createBufferSource(),g=ac.createGain(); s.buffer=b; g.gain.value=(G[k]||0.8)*0.5; s.connect(g); g.connect(ac.destination); s.start(); cur=s; }); }catch(e){ alert('This browser could not play the sound.'); } }
function add(id,list,cls){ var d=document.getElementById(id); list.forEach(function(x){ var b=document.createElement('button'); if(cls) b.className=cls; b.innerHTML=x[1]+(x[2]?'<small>'+x[2]+'</small>':''); b.onclick=function(){play(x[0]);}; d.appendChild(b); }); }
add('a',A); add('m',M,'m');
</script></body></html>
